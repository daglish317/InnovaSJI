{% if is_paginated %}
<nav aria-label="Pagination" class="d-flex justify-content-center">
  <ul class="pagination">
    {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}{% for k, v in request.GET.items %}{% if k != 'page' %}&amp;{{ k }}={{ v|urlencode }}{% endif %}{% endfor %}">Précédent</a></li>{% endif %}
    <li class="page-item active" aria-current="page"><span class="page-link">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}{% for k, v in request.GET.items %}{% if k != 'page' %}&amp;{{ k }}={{ v|urlencode }}{% endif %}{% endfor %}">Suivant</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
